<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Videocutter</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23E8B44C'/%3E%3Cpath d='M11 9l12 7-12 7z' fill='%230E1014'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="kopf">
  <div class="marke"><span class="marke-zeichen"></span>Videocutter</div>
  <input id="titel" class="titel" spellcheck="false" placeholder="Projekt" aria-label="Projekttitel" disabled>
  <div class="kopf-rechts">
    <div id="zustand" class="zustand" title="Was auf dem Rechner bereitsteht"></div>
    <button id="regelwerk-knopf" class="knopf leise" type="button"></button>
  </div>
</header>

<div class="rahmen">
  <aside class="seite">
    <button id="neu" class="knopf voll breit" type="button"></button>
    <div class="seite-titel">Projekte</div>
    <nav id="projekte" class="projekte"></nav>
  </aside>

  <main class="haupt">
    <nav id="schritte" class="schritte" aria-label="Arbeitsschritte"></nav>
    <section id="flaeche" class="flaeche"></section>
  </main>
</div>

<div id="overlay" class="overlay" hidden></div>
<div id="toasts" class="toasts" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
